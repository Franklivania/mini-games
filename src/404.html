<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost — Mini Games</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/global.css" />
  <style>
    .lost { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: var(--space-5); text-align: center; }
    .lost__x {
      width: 140px; aspect-ratio: 1; display: grid; place-items: center;
      background: var(--coral-400); border: 5px solid var(--color-border); box-shadow: var(--shadow-lg);
      font-weight: var(--font-weight-bold); font-size: 6rem; line-height: 1; transform: rotate(-6deg);
    }
    .lost h1 { font-size: var(--text-3xl); }
    .lost p { color: var(--color-text-muted); max-width: 36ch; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-header__logo" href="/"><img class="site-header__mark" src="/assets/favicon.svg" alt="" />Mini Games</a>
  </header>
  <main class="page lost">
    <div class="lost__x" aria-hidden="true">✕</div>
    <h1>The crowd didn't say that.</h1>
    <p>That page isn't on the board. Head back and pick a game.</p>
    <a class="btn btn--yellow btn--lg" href="/">Back to games</a>
  </main>
</body>
</html>
